<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123b70" />
    <meta name="description" content="Read-only administration dashboard for Campus Connect." />
    <title>Admin panel — Campus Connect</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script type="module" src="../src/js/theme.js"></script>
    <script type="module" src="dashboard.js"></script>
  </head>
  <body class="admin-page">
    <a class="skip-link" href="#admin-main">Skip to admin panel</a>
    <header class="site-header">
      <nav class="nav shell admin-topbar" aria-label="Admin header">
        <a class="brand" href="../index.html" aria-label="Campus Connect home">
          <span class="brand-mark" aria-hidden="true">CC</span>
          <span>campus<span class="brand-light">connect</span></span>
        </a>
        <div class="admin-identity">
          <span class="admin-avatar" id="admin-avatar" aria-label="Administrator initials">A</span>
          <span id="admin-name">Loading…</span>
        </div>
        <button class="button button-outline logout-button" type="button" id="logout-button">Log out</button>
      </nav>
    </header>

    <div class="admin-layout shell">
      <aside class="admin-sidebar" aria-label="Admin navigation">
        <p class="sidebar-label">ADMINISTRATION</p>
        <nav class="admin-nav" aria-label="Dashboard sections">
          <button class="nav-item is-active" data-view="overview" type="button"><span aria-hidden="true">⌂</span>Overview</button>
          <button class="nav-item" data-view="users" type="button"><span aria-hidden="true">♙</span>Users</button>
        </nav>
      </aside>

      <main id="admin-main" class="admin-main">
        <header class="page-heading">
          <div>
            <p class="eyebrow">CAMPUS CONNECT / ADMIN</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <a class="back-link" href="../student/dashboard.html">Student dashboard</a>
        </header>
        <div id="admin-notice" class="admin-notice" role="status" aria-live="polite" hidden></div>

        <section class="admin-view is-visible" id="view-overview" aria-labelledby="page-title">
          <div class="welcome-panel">
            <p class="eyebrow">LIVE COMMUNITY DATA</p>
            <h2>Community at a glance</h2>
            <p>Current totals from student profiles.</p>
          </div>
          <div class="stats-grid" id="stats-grid" aria-live="polite">
            <p class="loading">Loading profile totals…</p>
          </div>
        </section>

        <section class="admin-view" id="view-users" aria-labelledby="users-heading" hidden>
          <div class="section-heading">
            <div><p class="eyebrow">DIRECTORY</p><h2 id="users-heading">Users</h2></div>
            <span class="result-count" id="user-count">—</span>
          </div>
          <div class="user-filters">
            <label for="user-search">Search users</label>
            <input id="user-search" type="search" placeholder="Name, email or matric number" autocomplete="off" />
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="muted">Muted</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
          <div class="users-list" id="users-list" aria-live="polite">
            <p class="loading">Loading users…</p>
          </div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Admin dashboard sections">
      <button class="is-active" data-view="overview" type="button"><span aria-hidden="true">⌂</span>Overview</button>
      <button data-view="users" type="button"><span aria-hidden="true">♙</span>Users</button>
    </nav>
  </body>
</html>
